# Build i publikacja strony na GitHub Pages.
#
# Uruchamia się przy każdym pushu na `main` oraz ręcznie z zakładki Actions.
# Wymaga jednorazowego włączenia Pages w ustawieniach repozytorium:
# Settings → Pages → Source: GitHub Actions.
name: Wdrożenie na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uprawnienia potrzebne akcji deploy-pages do opublikowania artefaktu.
permissions:
  contents: read
  pages: write
  id-token: write

# Równoległe wdrożenia nie mają sensu — nowszy push anuluje starszy,
# ale trwające wdrożenie dokańczamy, żeby nie zostawić Pages w połowie.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Build
        run: npm run build

      - name: Spakowanie dist/ jako artefakt Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
